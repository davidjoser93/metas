<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Metas - Cuaderno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f1ea;
      --card-bg: #ffffff;
      --pen-color: #1e293b;
      --text: #0f172a;
      --text-muted: #475569;
      --highlight: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kalam', cursive;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(#d4d4d8 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text);
      padding: 16px 24px;
      line-height: 1.5;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .split-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (max-width: 1100px) {
      .split-layout {
        grid-template-columns: 1fr;
      }
    }

    .sketchy-panel {
      background: var(--card-bg);
      border: 3px solid var(--pen-color);
      border-radius: 2% 98% 2% 98% / 98% 2% 98% 2%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 4px 6px 0px rgba(0,0,0,0.05);
      position: relative;
    }

    .sketchy-panel:nth-child(even) {
      border-radius: 98% 2% 98% 2% / 2% 98% 2% 98%;
    }

    .panel-header {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--pen-color);
      text-align: center;
      border-bottom: 2px dashed var(--pen-color);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      gap: 10px;
    }

    .cal-nav-btn {
      background: #ffffff;
      border: 2px solid var(--pen-color);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      color: var(--pen-color);
      font-size: 1.15rem;
      font-family: 'Kalam', cursive;
      font-weight: 700;
      width: 40px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
      transition: all 0.15s ease;
      user-select: none;
      flex-shrink: 0;
    }

    .cal-nav-btn:hover:not(:disabled) {
      background: #fef08a;
      transform: scale(1.08);
      box-shadow: 2px 3px 0px var(--pen-color);
    }

    .cal-nav-btn:disabled {
      opacity: 0.25;
      cursor: default;
      box-shadow: none;
    }

    .cal-nav-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--pen-color);
      text-align: center;
      flex: 1;
    }

    .registro-container {
      display: flex;
      flex-direction: column;
      gap: 0;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: -3px 0px 0px #cbd5e1, 2px 4px 10px rgba(0,0,0,0.06);
    }
    
    .notebook-page {
      background-color: #fdfbf7;
      color: #1e3a8a;
      position: relative;
      padding: 8px 20px 8px 46px;
      border: none;
      border-bottom: 1px dashed #cbd5e1;
      border-radius: 0;
      box-shadow: none;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 27px,
        #94a3b8 28px
      );
      line-height: 28px;
      font-size: 1.15rem;
      margin-bottom: 0;
      transition: background-color 0.15s ease, padding 0.15s ease;
    }

    .notebook-page:last-child {
      border-bottom: none;
    }

    .notebook-page:hover {
      background-color: #fffefb;
    }

    .notebook-page::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 34px;
      width: 2px;
      background-color: #ef4444; 
    }

    .notebook-header-wrap {
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }

    .notebook-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0;
      border-bottom: 1.5px dashed #1e3a8a;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      line-height: 1.3;
      align-self: flex-start;
      transition: opacity 0.2s;
    }

    .notebook-header-wrap:hover .notebook-title {
      opacity: 0.75;
    }

    .notebook-arrow {
      font-size: 0.95rem;
      display: inline-block;
      transition: transform 0.2s ease;
      color: #3b82f6;
    }

    .notebook-subtitle {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1e3a8a;
      margin-top: 2px;
      margin-bottom: 2px;
      padding: 2px 8px;
      background: rgba(254, 240, 138, 0.55);
      border-left: 3px solid #f59e0b;
      border-radius: 2px 6px 6px 2px;
      display: inline-block;
      align-self: flex-start;
      line-height: 1.35;
      transition: background-color 0.2s ease;
    }

    .notebook-header-wrap:hover .notebook-subtitle {
      background: rgba(254, 240, 138, 0.85);
    }

    .notebook-body {
      margin-top: 10px;
      margin-bottom: 6px;
      padding-top: 8px;
      border-top: 1px dotted rgba(30, 58, 138, 0.2);
    }

    .notebook-checklist {
      margin-bottom: 15px;
    }
    
    .notebook-checklist-title {
      font-weight: 700;
      font-size: 1.3rem;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .notebook-target-list {
      list-style: none;
      padding-left: 0;
    }

    .notebook-target-item {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      padding: 0 4px;
      transition: background-color 0.12s ease;
    }

    .notebook-target-item:hover {
      background-color: rgba(254, 240, 138, 0.45);
    }

    .notebook-target-item.completed {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      opacity: 0.8;
    }

    .notebook-checkbox {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border: 2px solid #1e3a8a;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      line-height: 16px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      background: white;
      flex-shrink: 0;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .notebook-target-item:hover .notebook-checkbox {
      transform: scale(1.1);
      background: #fef08a;
    }

    .checklist-add-wrap {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .checklist-add-trigger {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px dashed #1e3a8a;
      border-radius: 6px;
      color: #1e3a8a;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 1px 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .checklist-add-trigger:hover {
      background: #fef08a;
      border-style: solid;
    }

    .checklist-inline-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 10px;
      border: 2px solid #1e3a8a;
      border-radius: 8px;
      max-width: 600px;
    }

    .notebook-more-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0 8px 0;
    }

    .notebook-circle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 2px solid #1e3a8a;
      border-radius: 50%;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1;
      color: #1e3a8a;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 1px 2px 0px rgba(30, 58, 138, 0.2);
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
      font-family: 'Kalam', cursive;
      padding: 0;
    }

    .notebook-circle-btn:hover {
      background: #fdfbf7;
      transform: scale(1.12);
      box-shadow: 2px 2px 0px #1e3a8a;
    }

    .notebook-entries {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .notebook-entry {
      display: block;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .cal-header {
      text-align: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--pen-color);
      border-bottom: 2px solid var(--pen-color);
      padding-bottom: 4px;
      border-radius: 50% 50% 50% 50% / 10% 10% 90% 90%;
    }

    .cal-day {
      background: transparent;
      border: 2px solid var(--pen-color);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      min-height: 70px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.1s ease;
      overflow: hidden;
    }

    .cal-day:hover {
      transform: scale(1.05) rotate(2deg);
      box-shadow: 2px 2px 0px var(--pen-color);
      z-index: 5;
    }

    .cal-day.empty {
      border: 2px dashed #94a3b8;
      cursor: default;
      opacity: 0.5;
    }

    .cal-day.empty:hover {
      transform: none;
      box-shadow: none;
      z-index: 1;
    }

    .cal-day.today {
      border: 3px solid #f43f5e;
      box-shadow: inset 0 0 0 2px #fef08a;
    }
    
    .cal-day.active-day {
      border-width: 3px;
      box-shadow: 3px 3px 0px var(--pen-color);
      transform: translateY(-2px);
    }

    .cal-day.dimmed {
      opacity: 0.25;
      filter: grayscale(0.8);
    }

    .cal-num {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--pen-color);
      z-index: 2;
    }

    .cal-day[style*="background"] .cal-num {
      color: #fff;
      text-shadow: 1px 1px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
    }

    .cal-badge-count {
      align-self: flex-end;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--card-bg);
      border: 2px solid var(--pen-color);
      padding: 0px 6px;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      color: var(--pen-color);
      z-index: 2;
    }

    .cal-projection-words {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 2px 0;
      width: 100%;
      text-align: center;
    }

    .cal-projection-word {
      font-size: 0.78rem;
      font-weight: 700;
      color: #1e3a8a;
      background: rgba(254, 240, 138, 0.65);
      border: 1px dashed rgba(30, 58, 138, 0.35);
      border-radius: 3px;
      padding: 1px 3px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Kalam', cursive;
    }

    .cal-day[style*="background"] .cal-projection-word {
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    .log-list-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 10px;
    }

    .log-list-container::-webkit-scrollbar {
      width: 8px;
    }
    .log-list-container::-webkit-scrollbar-thumb {
      background: var(--pen-color);
      border-radius: 4px;
    }

    .log-group {
      background: transparent;
      border: 2px solid var(--pen-color);
      border-left-width: 6px;
      border-radius: 2% 95% 3% 97% / 93% 4% 97% 5%;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.05);
    }

    .log-group-header {
      font-weight: 700;
      font-size: 1.2rem;
      border-bottom: 2px dashed #94a3b8;
      padding-bottom: 4px;
    }

    .log-item-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .log-item-text {
      font-size: 1rem;
      color: var(--text);
      padding-left: 14px;
      position: relative;
      flex: 1;
    }
    
    .log-item-text::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--pen-color);
      font-size: 1.2rem;
    }

    .log-item-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: block;
      margin-left: 14px;
      font-style: italic;
    }

    .edit-pencil-btn {
      background: #ffffff;
      border: 1.5px solid var(--pen-color);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.85rem;
      cursor: pointer;
      opacity: 0.75;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .edit-pencil-btn:hover {
      opacity: 1;
      background: #fef08a;
      transform: scale(1.08);
    }

    /* Formularios de Apuntes y Edición */
    .sketchy-form-box {
      background: #fdfbf7;
      border: 2px solid var(--pen-color);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 2px 3px 0px rgba(0, 0, 0, 0.08);
    }

    .sketchy-select,
    .sketchy-input,
    .sketchy-textarea {
      width: 100%;
      padding: 6px 10px;
      border: 2px solid var(--pen-color);
      border-radius: 6px;
      background: #ffffff;
      font-size: 1rem;
      color: var(--text);
      outline: none;
    }

    .sketchy-select:focus,
    .sketchy-input:focus,
    .sketchy-textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .sketchy-textarea {
      resize: vertical;
      min-height: 64px;
    }

    .sketchy-checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--pen-color);
      cursor: pointer;
      user-select: none;
      padding: 4px 10px;
      background: rgba(254, 240, 138, 0.5);
      border: 1.5px dashed var(--pen-color);
      border-radius: 6px;
      align-self: flex-start;
      transition: background-color 0.15s ease;
    }

    .sketchy-checkbox-label:hover {
      background: rgba(254, 240, 138, 0.9);
    }

    .sketchy-checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1e3a8a;
      cursor: pointer;
    }

    .sketchy-btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .sketchy-btn {
      padding: 4px 12px;
      border: 2px solid var(--pen-color);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      background: #ffffff;
      color: var(--pen-color);
      box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
      transition: all 0.15s ease;
    }

    .sketchy-btn:hover {
      transform: scale(1.04);
    }

    .sketchy-btn.save {
      background: #bbf7d0;
    }

    .sketchy-btn.save:hover {
      background: #86efac;
    }

    .sketchy-btn.delete {
      background: #fecdd3;
      color: #881337;
      border-color: #881337;
      margin-right: auto;
    }

    .sketchy-btn.delete:hover {
      background: #fda4af;
    }

    .sketchy-btn.cancel {
      background: #f1f5f9;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      cursor: pointer;
      max-width: 100%;
      height: auto;
    }

    /* --- MEDIA QUERIES PARA MÓVILES --- */
    @media (max-width: 768px) {
      body {
        padding: 12px;
        background-size: 15px 15px;
      }
      
      .container {
        gap: 20px;
      }

      .split-layout {
        gap: 20px;
      }

      .sketchy-panel {
        padding: 16px;
        gap: 16px;
      }
      
      .panel-header {
        font-size: 1.4rem;
      }

      .notebook-page {
        padding: 7px 12px 7px 32px;
        font-size: 1rem;
        line-height: 24px;
        background-image: repeating-linear-gradient(transparent, transparent 23px, #94a3b8 24px);
      }
      
      .notebook-page::before {
        left: 22px;
      }

      .notebook-title {
        font-size: 1.15rem;
      }

      .notebook-subtitle {
        font-size: 1.05rem;
        padding: 3px 8px;
      }

      .notebook-target-item {
        align-items: flex-start;
        margin-bottom: 6px;
      }
      
      .notebook-checkbox {
        flex-shrink: 0;
        margin-top: 3px;
      }

      .calendar-grid {
        gap: 4px;
      }

      .cal-day {
        min-height: 55px;
        padding: 4px;
      }

      .cal-num {
        font-size: 0.95rem;
      }
      
      .cal-badge-count {
        font-size: 0.65rem;
        padding: 0 4px;
      }
      
      .cal-header {
        font-size: 0.9rem;
      }

      .log-group {
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <section class="split-layout" id="sectionMonth">
    <div class="sketchy-panel">
      <div class="panel-header nav-header">
        <button class="cal-nav-btn prev-btn" id="calNavPrev" onclick="navigateCalView(-1)" title="Mes anterior">◀</button>
        <span id="calNavTitle" class="cal-nav-title">Octubre 2026</span>
        <button class="cal-nav-btn next-btn" id="calNavNext" onclick="navigateCalView(1)" title="Mes siguiente">▶</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
    <div class="sketchy-panel" id="monthRightPanel">
      <div class="panel-header nav-header" id="monthRightHeader">
        <span style="width: 40px;" id="monthRightSpacer"></span>
        <span id="monthRightTitle" class="cal-nav-title">Distribución de Octubre</span>
        <button class="cal-nav-btn" id="addApunteBtn" style="display: none;" onclick="toggleAddApunteForm()" title="Añadir apunte o proyección del día">+</button>
      </div>
      <div id="monthChartsWrap" style="display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; height: 100%;">
        <div class="canvas-container">
          <canvas id="pieMonthCanvas" width="480" height="230"></canvas>
        </div>
      </div>
      <div class="log-list-container" id="listMonth" style="display: none;"></div>
    </div>
  </section>

  <section class="split-layout" id="sectionGlobal" style="display: none;">
    <div class="sketchy-panel">
      <div class="panel-header nav-header">
        <button class="cal-nav-btn prev-btn" onclick="navigateCalView(-1)" title="Volver al calendario">◀</button>
        <span class="cal-nav-title">Distribución Global (Cantidad)</span>
        <a href="https://gemini.google.com/u/4/spark/chat/f29c46ad9bf47b35" target="_blank" rel="noopener noreferrer" class="cal-nav-btn next-btn" title="Editar metas en Gemini" style="text-decoration: none; font-size: 1.2rem;">✏️</a>
      </div>
      <div class="canvas-container">
        <canvas id="barGeneralCanvas" width="540" height="320"></canvas>
      </div>
    </div>

    <div class="sketchy-panel">
      <div class="panel-header">Distribución Global (Proporción)</div>
      <div class="canvas-container">
        <canvas id="pieChartGeneral" width="500" height="320"></canvas>
      </div>
    </div>
  </section>

  <section class="sketchy-panel" id="sectionRegistro">
    <div class="registro-container" id="registroMetasContainer"></div>
  </section>

  <div style="text-align: center; margin: 15px 0 30px 0;">
    <button id="btnGuardarDrive" class="cal-nav-btn" style="width: auto; padding: 10px 24px; font-size: 1.25rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;" onclick="guardarCambiosEnDrive()">
      💾 Guardar cambios en Drive
    </button>
    <div id="statusGuardado" style="margin-top: 10px; font-size: 1.1rem; font-weight: 700; color: #1e3a8a;"></div>
  </div>
</div>

<!-- SDK de Firebase (Compat para uso directo en HTML) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>

  // Estados de navegación y edición
  let currentViewIndex = -1;
  let activeFilterGroupTitle = null;
  let activeFilterMeta = null;
  let activeFilterDate = null;
  let hoveredMeta = null;
  const canvasClickRegions = {};

  // Estados para formularios en tiempo real
  let isAddingApunte = false;
  let newApunteCategory = "";
  let newApunteText = "";
  let newApunteIsProjection = false;
  let editingLogId = null;
  let editingProjId = null;
  let addingChecklistGoalId = null;

  // Estados para conservar desplegados los cuadernos al actualizar Firebase
  const expandedNotebookTitles = new Set();
  const expandedNotebookEntries = new Set();

  const DAYS_ES = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  const MONTHS_ES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
  const DAYS_FULL_ES = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  const MONTHS_FULL_ES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

  function getTodayStr() {
    const today = new Date();
    return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  }

  function formatShortDateEs(dateStr) {
    const [y, m, d] = dateStr.split("-");
    return `${d}/${m}/${y.substring(2)}`;
  }

  function formatDateEs(dateStr) {
    const [y, m, d] = dateStr.split("-");
    const dateObj = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
    const dayName = DAYS_ES[dateObj.getDay()];
    const monthName = MONTHS_ES[dateObj.getMonth()];
    return `${dayName} ${d} ${monthName} ${y}`;
  }

  function formatNotebookDate(dateStr) {
    const [y, m, d] = dateStr.split("-");
    const dateObj = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
    const dayName = DAYS_FULL_ES[dateObj.getDay()];
    const monthName = MONTHS_FULL_ES[dateObj.getMonth()].toLowerCase(); 
    return `${dayName} ${parseInt(d)} de ${monthName} del ${y}`;
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getAvailableViews() {
    const ymSet = new Set();
    const today = new Date();
    const currentYm = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
    ymSet.add(currentYm);

    CALENDAR_LOGS.forEach(l => {
      if (l.date && l.date.length >= 7) ymSet.add(l.date.substring(0, 7));
    });
    FUTURE_PROJECTIONS.forEach(p => {
      if (p.date && p.date.length >= 7) ymSet.add(p.date.substring(0, 7));
    });
    const sortedYm = Array.from(ymSet).sort();
    return [...sortedYm, "global"];
  }

  function getActiveMetas() {
    if (activeFilterGroupTitle) {
      const grp = customGroups.find(g => g.title === activeFilterGroupTitle);
      if (grp) return grp.metas;
    }
    if (activeFilterMeta) {
      return Array.isArray(activeFilterMeta) ? activeFilterMeta : [activeFilterMeta];
    }
    if (activeFilterDate) {
      const pastMetas = CALENDAR_LOGS.filter(l => l.date === activeFilterDate).map(l => l.meta);
      const projMetas = FUTURE_PROJECTIONS.filter(p => p.date === activeFilterDate).map(p => p.meta);
      return [...new Set([...pastMetas, ...projMetas])];
    }
    return [];
  }

  function toggleTitleFilter(groupTitle) {
    if (activeFilterGroupTitle === groupTitle) {
      activeFilterGroupTitle = null;
      activeFilterMeta = null;
    } else {
      activeFilterGroupTitle = groupTitle;
      activeFilterDate = null;
      isAddingApunte = false;
      editingLogId = null;
      editingProjId = null;
      const grp = customGroups.find(g => g.title === groupTitle);
      activeFilterMeta = grp ? (grp.metas.length === 1 ? grp.metas[0] : grp.metas) : null;
    }
    updateView();
  }

  function setMetaFilter(meta) {
    if (activeFilterMeta === meta && !activeFilterGroupTitle) {
      activeFilterMeta = null;
      activeFilterGroupTitle = null;
    } else {
      activeFilterMeta = meta;
      activeFilterDate = null;
      isAddingApunte = false;
      editingLogId = null;
      editingProjId = null;
      const grp = customGroups.find(g => g.metas.includes(meta));
      activeFilterGroupTitle = grp ? grp.title : null;
    }
    updateView();
  }

  function setDateFilter(dateStr) {
    if (activeFilterDate === dateStr) {
      activeFilterDate = null;
      isAddingApunte = false;
      editingLogId = null;
      editingProjId = null;
    } else {
      activeFilterDate = dateStr;
      isAddingApunte = false;
      newApunteCategory = "";
      newApunteText = "";
      newApunteIsProjection = false;
      editingLogId = null;
      editingProjId = null;
    }
    activeFilterMeta = null;
    activeFilterGroupTitle = null;
    updateView();
  }

  function toggleNotebook(element, groupTitle) {
    const page = element.closest('.notebook-page');
    if (!page) return;
    
    const body = page.querySelector('.notebook-body');
    const arrow = element.querySelector('.notebook-arrow');
    if (!body) return;

    if (window.getComputedStyle(body).display === 'none') {
      body.style.display = 'block';
      if (arrow) arrow.textContent = '▾';
      if (groupTitle) expandedNotebookTitles.add(groupTitle);
    } else {
      body.style.display = 'none';
      if (arrow) arrow.textContent = '▸';
      if (groupTitle) expandedNotebookTitles.delete(groupTitle);
    }
  }

  function toggleEntries(element, groupTitle) {
    const page = element.closest('.notebook-page');
    if (!page) return;
    
    const entries = page.querySelector('.notebook-entries');
    if (!entries) return;

    const isHidden = window.getComputedStyle(entries).display === 'none';

    if (isHidden) {
      entries.style.display = 'flex';
      element.textContent = '−';
      if (groupTitle) expandedNotebookEntries.add(groupTitle);
    } else {
      entries.style.display = 'none';
      element.textContent = '+';
      if (groupTitle) expandedNotebookEntries.delete(groupTitle);
    }
  }

  function navigateCalView(direction) {
    const views = getAvailableViews();
    const newIndex = currentViewIndex + direction;
    if (newIndex >= 0 && newIndex < views.length) {
      currentViewIndex = newIndex;
      if (activeFilterDate && views[currentViewIndex] !== "global" && !activeFilterDate.startsWith(views[currentViewIndex])) {
        activeFilterDate = null;
        isAddingApunte = false;
        editingLogId = null;
        editingProjId = null;
      }
      updateView();
    }
  }

  // --- FUNCIONES DE APUNTES Y PROYECCIONES DEL DÍA (CREAR, EDITAR, ELIMINAR EN FIREBASE) ---

  function toggleAddApunteForm() {
    isAddingApunte = !isAddingApunte;
    newApunteCategory = "";
    newApunteText = "";
    newApunteIsProjection = false;
    editingLogId = null;
    editingProjId = null;
    updateView();
  }

  function onSelectNewApunteCategory(selectEl) {
    newApunteCategory = selectEl.value;
    updateView();
    setTimeout(() => {
      const inputEl = document.getElementById("newApunteTextInput");
      if (inputEl) inputEl.focus();
    }, 50);
  }

  function saveNewApunte() {
    const textInput = document.getElementById("newApunteTextInput");
    const textVal = textInput ? textInput.value.trim() : newApunteText.trim();
    const projCheckbox = document.getElementById("newApunteIsProjCheckbox");
    const isProj = projCheckbox ? projCheckbox.checked : newApunteIsProjection;

    if (!activeFilterDate || !newApunteCategory || !textVal) return;

    if (isProj) {
      db.ref("futureProjections").push({
        date: activeFilterDate,
        meta: newApunteCategory,
        word: textVal
      });
    } else {
      db.ref("calendarLogs").push({
        date: activeFilterDate,
        meta: newApunteCategory,
        text: textVal
      });
    }

    isAddingApunte = false;
    newApunteCategory = "";
    newApunteText = "";
    newApunteIsProjection = false;
  }

  function startEditApunte(logId) {
    editingLogId = logId;
    editingProjId = null;
    isAddingApunte = false;
    updateView();
  }

  function cancelEditApunte() {
    editingLogId = null;
    updateView();
  }

  function saveEditedApunte(logId) {
    const catEl = document.getElementById(`editCat_${logId}`);
    const txtEl = document.getElementById(`editTxt_${logId}`);
    const projCheckEl = document.getElementById(`editIsProj_${logId}`);
    if (!catEl || !txtEl) return;

    const newCat = catEl.value;
    const newTxt = txtEl.value.trim();
    const convertToProj = projCheckEl ? projCheckEl.checked : false;
    if (!newCat || !newTxt) return;

    const currentLog = CALENDAR_LOGS.find(l => l._id === logId);

    if (convertToProj && currentLog) {
      db.ref("futureProjections").push({
        date: currentLog.date,
        meta: newCat,
        word: newTxt
      });
      db.ref(`calendarLogs/${logId}`).remove();
    } else {
      db.ref(`calendarLogs/${logId}`).update({
        meta: newCat,
        text: newTxt
      });
    }

    editingLogId = null;
  }

  function deleteApunte(logId) {
    db.ref(`calendarLogs/${logId}`).remove();
    editingLogId = null;
  }

  function startEditProj(projId) {
    editingProjId = projId;
    editingLogId = null;
    isAddingApunte = false;
    updateView();
  }

  function cancelEditProj() {
    editingProjId = null;
    updateView();
  }

    const catEl = document.getElementById(`editProjCat_${projId}`);
    const txtEl = document.getElementById(`editProjTxt_${projId}`);
    const projCheckEl = document.getElementById(`editProjIsProj_${projId}`);
    if (!catEl || !txtEl) return;

    const newCat = catEl.value;
    const newTxt = txtEl.value.trim();
    const keepAsProj = projCheckEl ? projCheckEl.checked : true;
    if (!newCat || !newTxt) return;

    const currentProj = FUTURE_PROJECTIONS.find(p => p._id === projId);

    if (!keepAsProj && currentProj) {
      // Si se desmarca "Es una proyección", pasa a ser un apunte realizado del día
      db.ref("calendarLogs").push({
        date: currentProj.date,
        meta: newCat,
        text: newTxt
      });
      db.ref(`futureProjections/${projId}`).remove();
    } else {
      db.ref(`futureProjections/${projId}`).update({
        meta: newCat,
        word: newTxt
      });
    }

    editingProjId = null;
  }

  function deleteProj(projId) {

    editingProjId = null;

  // --- ACTUALIZACIÓN DE VISTAS ---

  function updateView() {
    const views = getAvailableViews();
    const today = new Date();
    const initialYm = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;

    if (currentViewIndex < 0 || currentViewIndex >= views.length) {
      currentViewIndex = views.indexOf(initialYm) !== -1 ? views.indexOf(initialYm) : Math.max(0, views.length - 2);
    }

    const currentView = views[currentViewIndex];
    const isGlobalView = currentView === "global";
    const activeMetas = getActiveMetas();
    const isFiltering = activeFilterGroupTitle !== null || activeFilterMeta !== null || activeFilterDate !== null;

    renderRegistroMetas();

    const sectionMonth = document.getElementById("sectionMonth");
    const sectionGlobal = document.getElementById("sectionGlobal");

    if (isGlobalView) {
      sectionMonth.style.display = "none";
      sectionGlobal.style.display = "grid";
      drawMonthlyPieChart("pieChartGeneral", null);
      drawBarChartOrdered("barGeneralCanvas", null);
    } else {
      sectionMonth.style.display = "grid";
      sectionGlobal.style.display = "none";

      const [yStr, mStr] = currentView.split("-");
      const year = parseInt(yStr, 10);
      const monthZero = parseInt(mStr, 10) - 1;
      const monthName = MONTHS_FULL_ES[monthZero];

      const calNavTitle = document.getElementById("calNavTitle");
      if (calNavTitle) {
        calNavTitle.textContent = `${monthName} ${year}`;
      }

      const prevBtn = document.getElementById("calNavPrev");
      const nextBtn = document.getElementById("calNavNext");
      if (prevBtn) prevBtn.disabled = (currentViewIndex === 0);
      if (nextBtn) nextBtn.disabled = (currentViewIndex === views.length - 1);

      renderMonthCalendar("calendarGrid", year, monthZero);

      const monthChartsWrap = document.getElementById("monthChartsWrap");
      const listMonth = document.getElementById("listMonth");
      const monthRightTitle = document.getElementById("monthRightTitle");
      const addApunteBtn = document.getElementById("addApunteBtn");
      const monthRightSpacer = document.getElementById("monthRightSpacer");

      if (isFiltering) {
        monthChartsWrap.style.display = "none";
        listMonth.style.display = "flex";
        monthRightTitle.textContent = activeFilterDate ? `Apuntes del Día (${formatShortDateEs(activeFilterDate)})` : `Apuntes de ${monthName} (Filtrado)`;
        if (addApunteBtn) {
          addApunteBtn.style.display = activeFilterDate ? "inline-flex" : "none";
          addApunteBtn.textContent = isAddingApunte ? "−" : "+";
        }
        if (monthRightSpacer) {
          monthRightSpacer.style.display = activeFilterDate ? "inline-block" : "none";
        }
        renderGroupedLogList("listMonth", currentView, activeFilterDate ? null : activeMetas, activeFilterDate);
      } else {
        monthChartsWrap.style.display = "flex";
        listMonth.style.display = "none";
        monthRightTitle.textContent = `Distribución de ${monthName}`;
        if (addApunteBtn) addApunteBtn.style.display = "none";
        if (monthRightSpacer) monthRightSpacer.style.display = "none";
        drawMonthlyPieChart("pieMonthCanvas", currentView);
      }
    }
  }

  function renderRegistroMetas() {
    const container = document.getElementById("registroMetasContainer");
    container.innerHTML = "";

    let hasVisibleContent = false;
    const activeMetas = getActiveMetas();

    customGroups.forEach(group => {
      if (activeFilterGroupTitle && group.title !== activeFilterGroupTitle) {
        return;
      }
      if (activeFilterMeta && !activeFilterGroupTitle) {
        const matchesMeta = group.metas.some(m => activeMetas.includes(m));
        if (!matchesMeta) return;
      }

      let logs = CALENDAR_LOGS.filter(l => group.metas.includes(l.meta));
      let projs = FUTURE_PROJECTIONS.filter(p => group.metas.includes(p.meta));
      let metasWithTargets = DATA_GOALS.filter(g => group.metas.includes(g.title));

      if (activeFilterMeta && !Array.isArray(activeFilterMeta)) {
        logs = logs.filter(l => l.meta === activeFilterMeta);
        projs = projs.filter(p => p.meta === activeFilterMeta);
        metasWithTargets = metasWithTargets.filter(g => g.title === activeFilterMeta);
      }

      if (activeFilterDate) {
        logs = logs.filter(l => l.date === activeFilterDate);
        projs = projs.filter(p => p.date === activeFilterDate);
        metasWithTargets = metasWithTargets.filter(g => {
          const hasActivityToday = logs.some(l => l.meta === g.title);
          const hasProjToday = projs.some(p => p.meta === g.title);
          const completedTargetToday = (g.targets || []).some(t => t.completedDate === activeFilterDate);
          return hasActivityToday || hasProjToday || completedTargetToday;
        });
      }

      if (logs.length === 0 && projs.length === 0 && metasWithTargets.length === 0) return;
      hasVisibleContent = true;

      const page = document.createElement("div");
      page.className = "notebook-page";

      const isThisActive =
        activeFilterGroupTitle === group.title ||
        (activeFilterMeta && group.metas.includes(activeFilterMeta)) ||
        (activeFilterDate !== null) ||
        expandedNotebookTitles.has(group.title);

      const displayTitle = activeFilterMeta && !Array.isArray(activeFilterMeta) && group.metas.includes(activeFilterMeta) ? activeFilterMeta : group.title;
      const bodyDisplay = isThisActive ? "block" : "none";
      const arrowIcon = isThisActive ? "▾" : "▸";

      const isEntriesOpen = (activeFilterDate !== null) || expandedNotebookEntries.has(group.title);
      const entriesDisplay = isEntriesOpen ? "flex" : "none";
      const plusIcon = isEntriesOpen ? "−" : "+";

      const safeTitle = group.title.replace(/'/g, "\\'");
      let html = `<div class="notebook-header-wrap" onclick="toggleTitleFilter('${safeTitle}')">`;
      html += `<div class="notebook-title">${escapeHtml(displayTitle)} <span class="notebook-arrow">${arrowIcon}</span></div>`;
      html += `</div>`;
      html += `<div class="notebook-body" style="display: ${bodyDisplay};">`;

      if (metasWithTargets.length > 0) {
        metasWithTargets.forEach(g => {
          html += `<div class="notebook-checklist">`;
          if (group.metas.length > 1 && !activeFilterMeta) {
            html += `<div class="notebook-checklist-title">${escapeHtml(g.title)}:</div>`;
          }
          
          html += `<ul class="notebook-target-list">`;
          (g.targets || []).forEach(t => {
            const isTargetOfThisDay = activeFilterDate && t.completedDate === activeFilterDate;
            const textStyle = isTargetOfThisDay ? "font-weight: bold; color: #f43f5e;" : "";
            
            html += `
              <li class="notebook-target-item ${t.done ? 'completed' : ''}" onclick="toggleChecklistItem('${g._id}', '${t._id}', ${!t.done})" title="Haz clic para marcar o desmarcar">
                <span class="notebook-checkbox">${t.done ? '✓' : ''}</span>
                <span style="${textStyle}">${escapeHtml(t.name)}${t.done && t.completedDate ? ` (${formatShortDateEs(t.completedDate)})` : ''}</span>
              </li>
            `;
          });
          html += `</ul>`;

          // Botón o formulario para añadir un nuevo ítem al checklist
          html += `<div class="checklist-add-wrap">`;
          if (addingChecklistGoalId === g._id) {
            html += `
              <div class="checklist-inline-form">
                <input type="text" id="newChecklistInput_${g._id}" class="sketchy-input" placeholder="Nuevo ítem para ${escapeHtml(g.title)}..." style="flex: 1; min-width: 180px;" onkeydown="if(event.key==='Enter') saveNewChecklistItem('${g._id}')" />
                <button class="sketchy-btn save" onclick="saveNewChecklistItem('${g._id}')">Guardar</button>
                <button class="sketchy-btn cancel" onclick="cancelAddChecklistForm()">Cancelar</button>
              </div>
            `;
          } else {
            html += `
              <button class="checklist-add-trigger" onclick="openAddChecklistForm('${g._id}', '${safeTitle}')">+ Añadir ítem al checklist</button>
            `;
          }
          html += `</div></div>`;
        });
      }

      const totalItems = logs.length + projs.length;
      if (totalItems > 0) {
        html += `
          <div class="notebook-more-wrap">
            <button class="notebook-circle-btn" onclick="toggleEntries(this, '${safeTitle}')" title="Ver / Ocultar días">${plusIcon}</button>
          </div>
          <div class="notebook-entries" style="display: ${entriesDisplay};">
        `;
        logs.sort((a, b) => a.date.localeCompare(b.date)).forEach(log => {
          const dateStr = formatNotebookDate(log.date);
          const logText = log.isCompletion ? `<strong>${escapeHtml(log.text)}</strong>` : escapeHtml(log.text);
          html += `
            <div class="notebook-entry">
              <strong>${dateStr}:</strong> ${logText}
            </div>
          `;
        });
        projs.sort((a, b) => a.date.localeCompare(b.date)).forEach(p => {
          const dateStr = formatNotebookDate(p.date);
          html += `
            <div class="notebook-entry" style="font-style: italic;">
              <strong>${dateStr}:</strong> <span style="background: rgba(254, 240, 138, 0.55); padding: 1px 6px; border-radius: 3px; border-left: 2px solid #f59e0b;">[Proyección] ${escapeHtml(p.word)}</span>
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `</div>`;

      page.innerHTML = html;
      container.appendChild(page);
    });

    if (!hasVisibleContent) {
      container.innerHTML = `<div class="notebook-page"><div class="notebook-title" onclick="toggleTitleFilter(null)" style="cursor: pointer;">Página en blanco</div><p style="margin-top: 10px;">No hay apuntes para esta selección.</p></div>`;
    }
  }

  function renderMonthCalendar(containerId, year, month) {
    const grid = document.getElementById(containerId);
    if (!grid) return;
    grid.innerHTML = "";

    const daysOfWeek = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
    daysOfWeek.forEach(d => {
      const header = document.createElement("div");
      header.className = "cal-header";
      header.textContent = d;
      grid.appendChild(header);
    });

    const firstDayIndex = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayStr = getTodayStr();
    const activeMetas = getActiveMetas();
    const isFilteredByMeta = (activeFilterGroupTitle !== null || activeFilterMeta !== null || hoveredMeta !== null);
    const filterMetasList = hoveredMeta ? [hoveredMeta] : activeMetas;

    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "cal-day empty";
      grid.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const monthStr = String(month + 1).padStart(2, "0");
      const dayStr = String(day).padStart(2, "0");
      const dateStr = `${year}-${monthStr}-${dayStr}`;

      const cell = document.createElement("div");
      cell.className = "cal-day";
      if (dateStr === todayStr) cell.classList.add("today");
      if (dateStr === activeFilterDate) cell.classList.add("active-day");

      const dayEvents = CALENDAR_LOGS.filter(e => e.date === dateStr);
      const dayProjections = FUTURE_PROJECTIONS.filter(p => p.date === dateStr);
      const hasAhorrarLogged = dayEvents.some(e => e.meta === "Ahorrar");
      
      const cuotaYellowColor = "#facc15";
      const cobroAppleGreenColor = "#84cc16";

      const pendingAhorrarProjs = hasAhorrarLogged ? [] : dayProjections.filter(p => p.meta === "Ahorrar");
      const isCobroPending = pendingAhorrarProjs.some(p => p.word.toLowerCase().includes("quincena") || p.word.toLowerCase().includes("cobro"));
      const isPagoPending = pendingAhorrarProjs.some(p => p.word.includes("$") || p.word.toLowerCase().includes("cuota"));
      const hasPendingAhorrar = isCobroPending || isPagoPending;

      let isDimmed = false;

      if (dayEvents.length > 0) {
        if (isFilteredByMeta && filterMetasList.length > 0) {
          const matchingEvents = dayEvents.filter(e => filterMetasList.includes(e.meta));
          const matchesAhorrarProj = hasPendingAhorrar && filterMetasList.includes("Ahorrar");

          if (matchingEvents.length > 0 || matchesAhorrarProj) {
            let cols = [...new Set(matchingEvents.map(e => (GOAL_CONFIG[e.meta] || { color: "#334155" }).color))];
            if (matchesAhorrarProj) {
              if (isCobroPending && !cols.includes(cobroAppleGreenColor)) cols.push(cobroAppleGreenColor);
              if (isPagoPending && !cols.includes(cuotaYellowColor)) cols.push(cuotaYellowColor);
            }

            if (cols.length === 1) {
              cell.style.background = cols[0];
            } else if (cols.length === 2) {
              cell.style.background = `repeating-linear-gradient(45deg, ${cols[0]}, ${cols[0]} 10px, ${cols[1]} 10px, ${cols[1]} 20px)`;
            } else {
              const stripeWidth = 10;
              const parts = cols.map((c, i) => `${c} ${i * stripeWidth}px, ${c} ${(i + 1) * stripeWidth}px`);
              cell.style.background = `repeating-linear-gradient(45deg, ${parts.join(", ")})`;
            }
          } else {
            isDimmed = true;
          }
        } else {
          let uniqueMetas = [...new Set(dayEvents.map(e => e.meta))];
          let cols = uniqueMetas.map(m => (GOAL_CONFIG[m] || { color: "#334155" }).color);

          if (isCobroPending && !cols.includes(cobroAppleGreenColor)) cols.push(cobroAppleGreenColor);
          if (isPagoPending && !cols.includes(cuotaYellowColor)) cols.push(cuotaYellowColor);

          if (cols.length === 1) {
            cell.style.background = cols[0];
          } else if (cols.length === 2) {
            cell.style.background = `repeating-linear-gradient(45deg, ${cols[0]}, ${cols[0]} 10px, ${cols[1]} 10px, ${cols[1]} 20px)`;
          } else {
            const stripeWidth = 10;
            const parts = cols.map((c, i) => `${c} ${i * stripeWidth}px, ${c} ${(i + 1) * stripeWidth}px`);
            cell.style.background = `repeating-linear-gradient(45deg, ${parts.join(", ")})`;
          }
        }
      } else if (hasPendingAhorrar) {
        let cols = [];
        if (isCobroPending) cols.push(cobroAppleGreenColor);
        if (isPagoPending) cols.push(cuotaYellowColor);

        if (isFilteredByMeta && filterMetasList.length > 0) {
          if (filterMetasList.includes("Ahorrar")) {
            if (cols.length === 1) {
              cell.style.background = cols[0];
            } else {
              cell.style.background = `repeating-linear-gradient(45deg, ${cols[0]}, ${cols[0]} 10px, ${cols[1]} 10px, ${cols[1]} 20px)`;
            }
          } else {
            isDimmed = true;
          }
        } else {
          if (cols.length === 1) {
            cell.style.background = cols[0];
          } else {
            cell.style.background = `repeating-linear-gradient(45deg, ${cols[0]}, ${cols[0]} 10px, ${cols[1]} 10px, ${cols[1]} 20px)`;
          }
        }
      } else {
        if (isFilteredByMeta && filterMetasList.length > 0) isDimmed = true;
      }

      const visibleProjections = (isFilteredByMeta && filterMetasList.length > 0)
        ? dayProjections.filter(p => filterMetasList.includes(p.meta))
        : dayProjections;

      if (isFilteredByMeta && filterMetasList.length > 0 && visibleProjections.length > 0) {
        isDimmed = false;
      }

      if (activeFilterDate && dateStr !== activeFilterDate) {
        isDimmed = true;
      }

      if (isDimmed) cell.classList.add("dimmed");

      cell.innerHTML = `
        <div class="cal-num">${day}</div>
        ${visibleProjections.length > 0 ? `
          <div class="cal-projection-words">
            ${visibleProjections.map(p => `<div class="cal-projection-word" title="${escapeHtml(p.meta)}: ${escapeHtml(p.word)}">${escapeHtml(p.word)}</div>`).join("")}
          </div>
        ` : ''}
        ${dayEvents.length > 0 ? `<div class="cal-badge-count">${dayEvents.length} act.</div>` : ''}
      `;

      cell.onclick = () => setDateFilter(dateStr);
      grid.appendChild(cell);
    }
  }

  function drawMonthlyPieChart(canvasId, filterYearMonth) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvasClickRegions[canvasId] = [];

    const activeMetas = getActiveMetas();
    const counts = {};
    const filteredLogs = filterYearMonth 
      ? CALENDAR_LOGS.filter(l => l.date.startsWith(filterYearMonth))
      : CALENDAR_LOGS;

    filteredLogs.forEach(log => {
      counts[log.meta] = (counts[log.meta] || 0) + 1;
    });

    const entries = Object.keys(counts)
      .map(meta => ({
        meta,
        count: counts[meta],
        color: (GOAL_CONFIG[meta] || { color: "#64748b" }).color
      }))
      .sort((a, b) => b.count - a.count || a.meta.localeCompare(b.meta));

    const total = entries.reduce((sum, item) => sum + item.count, 0);
    if (total === 0) {
      ctx.fillStyle = "#475569";
      ctx.font = "italic 16px 'Kalam', cursive";
      ctx.textAlign = "center";
      ctx.fillText("Sin actividades", canvas.width / 2, canvas.height / 2);
      return;
    }

    const centerX = 130;
    const centerY = canvas.height / 2;
    const radius = Math.min(95, canvas.height / 2 - 20);
    let startAngle = -Math.PI / 2;

    entries.forEach(item => {
      const sliceAngle = (item.count / total) * 2 * Math.PI;
      const endAngle = startAngle + sliceAngle;

      let isSelected = false;
      let isDimmed = false;

      if (hoveredMeta) {
        isSelected = item.meta === hoveredMeta;
        isDimmed = item.meta !== hoveredMeta;
      } else {
        isSelected = activeMetas.includes(item.meta);
        isDimmed = activeMetas.length > 0 && !isSelected;
      }

      const activeRadius = isSelected ? radius + 8 : radius;

      ctx.save();
      if (isDimmed) ctx.globalAlpha = 0.25;

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, activeRadius, startAngle, endAngle);
      ctx.closePath();
      
      ctx.fillStyle = item.color;
      ctx.fill();

      ctx.lineWidth = isSelected ? 4 : 2;
      ctx.strokeStyle = "#1e293b";
      ctx.stroke();
      ctx.restore();

      canvasClickRegions[canvasId].push({
        type: 'pie',
        meta: item.meta,
        startAngle,
        endAngle,
        centerX,
        centerY,
        radius: activeRadius
      });

      startAngle = endAngle;
    });

    const legendX = 260;
    let legendY = Math.max(30, centerY - (entries.length * 12));
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    entries.forEach(item => {
      let isSelected = false;
      let isDimmed = false;

      if (hoveredMeta) {
        isSelected = item.meta === hoveredMeta;
        isDimmed = item.meta !== hoveredMeta;
      } else {
        isSelected = activeMetas.includes(item.meta);
        isDimmed = activeMetas.length > 0 && !isSelected;
      }

      ctx.save();
      if (isDimmed) ctx.globalAlpha = 0.3;

      ctx.beginPath();
      ctx.rect(legendX, legendY - 8, 16, 16);
      ctx.fillStyle = item.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#1e293b";
      ctx.stroke();

      ctx.fillStyle = "#0f172a"; 
      ctx.font = isSelected ? "bold 15px 'Kalam', cursive" : "15px 'Kalam', cursive";
      ctx.fillText(`${item.meta} (${item.count})`, legendX + 26, legendY);
      ctx.restore();

      canvasClickRegions[canvasId].push({
        type: 'bar',
        meta: item.meta,
        x: legendX,
        y: legendY - 10,
        w: 180,
        h: 20
      });

      legendY += 24;
    });
  }

  function drawBarChartOrdered(canvasId, filterYearMonth) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvasClickRegions[canvasId] = [];

    const activeMetas = getActiveMetas();

    const counts = {};
    DATA_GOALS.forEach(g => { counts[g.title] = 0; });

    const filteredLogs = filterYearMonth 
      ? CALENDAR_LOGS.filter(l => l.date.startsWith(filterYearMonth))
      : CALENDAR_LOGS;

    filteredLogs.forEach(log => {
      counts[log.meta] = (counts[log.meta] || 0) + 1;
    });

    const sortedGoals = [...DATA_GOALS].sort((a, b) => counts[b.title] - counts[a.title] || a.title.localeCompare(b.title));

    const labels = sortedGoals.map(g => g.title);
    if (labels.length === 0) return;

    const values = labels.map(k => counts[k]);
    const maxVal = Math.max(5, ...values);

    const padLeft = 40;
    const padBottom = 100;
    const padTop = 30;
    const padRight = 20;
    const chartW = canvas.width - padLeft - padRight;
    const chartH = canvas.height - padTop - padBottom;

    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(padLeft, padTop - 10);
    ctx.lineTo(padLeft, padTop + chartH);
    ctx.lineTo(padLeft + chartW + 10, padTop + chartH);
    ctx.stroke();

    ctx.fillStyle = "#0f172a";
    ctx.font = "14px 'Kalam', cursive";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    const steps = 4;
    for (let i = 0; i <= steps; i++) {
      const val = Math.round((maxVal / steps) * i);
      const y = padTop + chartH - (i / steps) * chartH;
      ctx.fillText(val, padLeft - 10, y);

      if (i > 0) {
        ctx.beginPath();
        ctx.strokeStyle = "#94a3b8";
        ctx.setLineDash([4, 4]);
        ctx.moveTo(padLeft, y);
        ctx.lineTo(padLeft + chartW, y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    const slotW = chartW / labels.length;
    const barW = Math.min(24, slotW * 0.7);

    labels.forEach((meta, idx) => {
      const val = counts[meta];
      const barH = (val / maxVal) * chartH;
      const x = padLeft + idx * slotW + (slotW - barW) / 2;
      const y = padTop + chartH - barH;
      const color = (GOAL_CONFIG[meta] || { color: "#38bdf8" }).color;

      let isSelected = false;
      let isDimmed = false;

      if (hoveredMeta) {
        isSelected = meta === hoveredMeta;
        isDimmed = meta !== hoveredMeta;
      } else {
        isSelected = activeMetas.includes(meta);
        isDimmed = activeMetas.length > 0 && !isSelected;
      }

      ctx.save();
      if (isDimmed) ctx.globalAlpha = 0.25;

      ctx.beginPath();
      if (val === 0) {
        ctx.rect(x, padTop + chartH - 2, barW, 2);
      } else {
        ctx.rect(x, y, barW, barH);
      }
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = isSelected ? 3 : 2;
      ctx.strokeStyle = "#1e293b";
      ctx.stroke();

      ctx.fillStyle = "#0f172a";
      ctx.textAlign = "center";
      ctx.font = isSelected ? "bold 15px 'Kalam', cursive" : "15px 'Kalam', cursive";
      ctx.fillText(val, x + barW / 2, val === 0 ? padTop + chartH - 12 : y - 10);

      ctx.save();
      ctx.translate(x + barW / 2 + 5, padTop + chartH + 15);
      ctx.rotate(-Math.PI / 4);
      ctx.textAlign = "right";
      ctx.fillStyle = "#0f172a";
      ctx.font = isSelected ? "bold 14px 'Kalam', cursive" : "14px 'Kalam', cursive";
      ctx.fillText(meta.length > 15 ? meta.substring(0, 14) + '…' : meta, 0, 0);
      ctx.restore();

      ctx.restore();

      canvasClickRegions[canvasId].push({
        type: 'bar',
        meta,
        x: x - 4,
        y: padTop,
        w: barW + 8,
        h: chartH + padBottom
      });
    });
  }

  function redrawVisibleCharts() {
    const views = getAvailableViews();
    const currentView = views[currentViewIndex];
    if (currentView === "global") {
      drawMonthlyPieChart("pieChartGeneral", null);
      drawBarChartOrdered("barGeneralCanvas", null);
    } else {
      const isFiltering = activeFilterGroupTitle !== null || activeFilterMeta !== null || activeFilterDate !== null;
      if (!isFiltering) {
        drawMonthlyPieChart("pieMonthCanvas", currentView);
      }
    }
  }

  function handleCanvasClick(e, canvasId) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    
    const regions = canvasClickRegions[canvasId] || [];
    const rect = canvas.getBoundingClientRect();
    
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    for (const reg of regions) {
      if (reg.type === 'pie') {
        const dx = x - reg.centerX;
        const dy = y - reg.centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist <= reg.radius) {
          let angle = Math.atan2(dy, dx);
          if (angle < -Math.PI / 2) angle += 2 * Math.PI;

          if (angle >= reg.startAngle && angle <= reg.endAngle) {
            setMetaFilter(reg.meta);
            return;
          }
        }
      } else if (reg.type === 'bar') {
        if (x >= reg.x && x <= reg.x + reg.w && y >= reg.y && y <= reg.y + reg.h) {
          setMetaFilter(reg.meta);
          return;
        }
      }
    }
  }

  function handleCanvasMouseMove(e, canvasId) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;

    const regions = canvasClickRegions[canvasId] || [];
    const rect = canvas.getBoundingClientRect();
    
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    
    let foundMeta = null;

    for (const reg of regions) {
      if (reg.type === 'pie') {
        const dx = x - reg.centerX;
        const dy = y - reg.centerY;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist <= reg.radius) {
          let angle = Math.atan2(dy, dx);
          if (angle < -Math.PI / 2) angle += 2 * Math.PI;

          if (angle >= reg.startAngle && angle <= reg.endAngle) {
            foundMeta = reg.meta;
            break;
          }
        }
      } else if (reg.type === 'bar') {
        if (x >= reg.x && x <= reg.x + reg.w && y >= reg.y && y <= reg.y + reg.h) {
          foundMeta = reg.meta;
          break;
        }
      }
    }

    if (hoveredMeta !== foundMeta) {
      hoveredMeta = foundMeta;
      e.target.style.cursor = foundMeta ? 'pointer' : 'default';
      redrawVisibleCharts();
      const views = getAvailableViews();
      const currentView = views[currentViewIndex];
      if (currentView && currentView !== "global") {
        const [yStr, mStr] = currentView.split("-");
        renderMonthCalendar("calendarGrid", parseInt(yStr, 10), parseInt(mStr, 10) - 1);
      }
    }
  }

  function handleCanvasMouseLeave() {
    if (hoveredMeta !== null) {
      hoveredMeta = null;
      redrawVisibleCharts();
      const views = getAvailableViews();
      const currentView = views[currentViewIndex];
      if (currentView && currentView !== "global") {
        const [yStr, mStr] = currentView.split("-");
        renderMonthCalendar("calendarGrid", parseInt(yStr, 10), parseInt(mStr, 10) - 1);
      }
    }
  }

  function connectFirebaseRealtime() {
    db.ref("/").on("value", (snapshot) => {
      const data = snapshot.val();

      // Si Firebase está completamente vacío, sembramos la data inicial automáticamente
      if (!data || (!data.dataGoals && !data.calendarLogs && !data.futureProjections && !data.initialized)) {
        db.ref("/").set({
          initialized: true,
          dataGoals: INITIAL_DATA_GOALS,
          calendarLogs: INITIAL_CALENDAR_LOGS,
          futureProjections: INITIAL_FUTURE_PROJECTIONS
        });
        return;
      }

      // Cargar DATA_GOALS con sus respectivos IDs de Firebase
      DATA_GOALS = [];
      if (data.dataGoals) {
        Object.entries(data.dataGoals).forEach(([gKey, gVal]) => {
          if (gVal) {
            const targets = [];
            if (gVal.targets) {
              Object.entries(gVal.targets).forEach(([tKey, tVal]) => {
                if (tVal) targets.push({ ...tVal, _id: tKey });
              });
            }
            DATA_GOALS.push({ ...gVal, _id: gKey, targets });
          }
        });
      }

      // Cargar CALENDAR_LOGS con sus respectivos IDs de Firebase
      CALENDAR_LOGS = [];
      if (data.calendarLogs) {
        Object.entries(data.calendarLogs).forEach(([lKey, lVal]) => {
          if (lVal && lVal.date && lVal.meta) {
            CALENDAR_LOGS.push({ ...lVal, _id: lKey });
          }
        });
      }

      // Cargar FUTURE_PROJECTIONS con sus respectivos IDs de Firebase
      FUTURE_PROJECTIONS = [];
      if (data.futureProjections) {
        Object.entries(data.futureProjections).forEach(([pKey, pVal]) => {
          if (pVal && pVal.date && pVal.meta) {
            FUTURE_PROJECTIONS.push({ ...pVal, _id: pKey });
          }
        });
      }

      updateView();
    });
  }


  async function guardarCambiosEnDrive() {
    const btn = document.getElementById("btnGuardarDrive");
    const statusEl = document.getElementById("statusGuardado");
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyGVEirVLcVAGdaQ0bPSvAKYed4QJuWOCV6EsYSag7J-xT_F_8GQIrFSKXmT6MOcehl/exec";

    if (btn) btn.disabled = true;
    if (statusEl) {
      statusEl.style.color = "#1e3a8a";
      statusEl.textContent = "⏳ Guardando datos en Google Drive...";
    }

    try {
      // Sanitizar IDs internos para dejar la estructura limpia
      const cleanGoals = DATA_GOALS.map(g => {
        const copy = { ...g };
        delete copy._id;
        if (copy.targets) {
          copy.targets = copy.targets.map(t => {
            const tCopy = { ...t };
            delete tCopy._id;
            return tCopy;
          });
        }
        return copy;
      });

      const cleanLogs = CALENDAR_LOGS.map(l => {
        const copy = { ...l };
        delete copy._id;
        return copy;
      });

      const cleanProjections = FUTURE_PROJECTIONS.map(p => {
        const copy = { ...p };
        delete copy._id;
        return copy;
      });

      const payload = {
        fechaExportacion: new Date().toISOString(),
        dataGoals: cleanGoals,
        calendarLogs: cleanLogs,
        futureProjections: cleanProjections
      };

      await fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });

      if (statusEl) {
        statusEl.style.color = "#15803d";
        statusEl.textContent = "✅ ¡Datos sincronizados y guardados en Google Drive exitosamente!";
      }
    } catch (error) {
      console.error("Error al guardar en Drive:", error);
      if (statusEl) {
        statusEl.style.color = "#dc2626";
        statusEl.textContent = "❌ Error al guardar en Drive: " + error.message;
      }
    } finally {
      if (btn) btn.disabled = false;
      setTimeout(() => {
        if (statusEl && statusEl.textContent.includes("exitosamente")) {
          statusEl.textContent = "";
        }
      }, 5000);
    }
  }

  function init() {
    const canvasIds = [
      "pieChartGeneral", "barGeneralCanvas", "pieMonthCanvas"
    ];

    canvasIds.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener("click", (e) => handleCanvasClick(e, id));
        el.addEventListener("mousemove", (e) => handleCanvasMouseMove(e, id));
        el.addEventListener("mouseleave", () => handleCanvasMouseLeave());
      }
    });

    connectFirebaseRealtime();
  }

  window.onload = init;
</script>
